[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainstar"
version = "0.1.0.dev0"
description = "Raw blockchain data to clean dimensional tables in your own warehouse, from one command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bit Primitive" }]
requires-python = ">=3.11"
keywords = [
    "blockchain",
    "onchain",
    "on-chain data",
    "web3",
    "crypto",
    "ethereum",
    "base",
    "bitcoin",
    "solana",
    "erc20",
    "token transfers",
    "wallet history",
    "etl",
    "data engineering",
    "data warehouse",
    "star schema",
    "dbt",
    "duckdb",
    "postgres",
    "clickhouse",
    "bigquery",
    "snowflake",
    "motherduck",
    "parquet",
    "data lake",
    "s3",
    "csv",
    "excel",
    "cryo",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Office/Business :: Financial",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.8,<2",
    "dbt-postgres>=1.8,<2",
]

[project.optional-dependencies]
# Warehouses reached through their own drivers. DuckDB, Postgres, MotherDuck and
# Parquet lakes (local or S3-compatible) need nothing extra.
clickhouse = ["dbt-clickhouse>=1.10,<2", "clickhouse-connect>=0.10"]
bigquery = ["dbt-bigquery>=1.10,<2"]
# pyarrow: Snowflake's connector returns query results to export as Arrow tables.
snowflake = ["dbt-snowflake>=1.10,<2", "pyarrow>=14"]
# Plug-ins for the tools data teams already run (see the README's "Using chainstar
# from dlt and Airbyte"). pyarrow: the dlt source hands dlt Arrow tables.
dlt = ["dlt>=1.31,<2", "pyarrow>=14"]
airbyte = ["airbyte-cdk>=7.38,<8"]
all = ["chainstar[clickhouse,bigquery,snowflake]"]

[project.urls]
Homepage = "https://bitprimitive.com/projects/chainstar"
Documentation = "https://github.com/Bit-Primitive/chainstar#readme"
Source = "https://github.com/Bit-Primitive/chainstar"
Issues = "https://github.com/Bit-Primitive/chainstar/issues"
Changelog = "https://github.com/Bit-Primitive/chainstar/blob/main/CHANGELOG.md"
"Live demo" = "https://bitprimitive.com/projects/chainstar/demo"

[project.scripts]
chainstar = "chainstar.cli:app"

[dependency-groups]
# dlt's DuckDB and Postgres destinations, for the dlt source's end-to-end tests.
dev = ["pytest>=8", "ruff>=0.6", "dlt[duckdb,postgres]>=1.31,<2"]

[tool.hatch.build.targets.wheel]
packages = ["src/chainstar"]

[tool.hatch.build.targets.sdist]
include = ["src/chainstar", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "postgres: needs a Postgres server (set CHAINSTAR_TEST_POSTGRES_DSN)",
    "clickhouse: needs a ClickHouse server (set CHAINSTAR_TEST_CLICKHOUSE_URL)",
    "s3: needs S3-compatible storage (set CHAINSTAR_TEST_S3_ENDPOINT)",
]
