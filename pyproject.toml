[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "chainstar"
version = "0.1.0.dev0"
description = "Raw blockchain data to clean dimensional tables in your own warehouse, from one command."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bit Primitive" }]
requires-python = ">=3.11"
keywords = [
    "ethereum",
    "base",
    "bitcoin",
    "solana",
    "blockchain",
    "dbt",
    "duckdb",
    "postgres",
    "cryo",
    "star-schema",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "pyyaml>=6.0",
    "duckdb>=1.1",
    "dbt-core>=1.10,<2",
    "dbt-duckdb>=1.8,<2",
    "dbt-postgres>=1.8,<2",
]

[project.urls]
Homepage = "https://github.com/Bit-Primitive/chainstar"
Issues = "https://github.com/Bit-Primitive/chainstar/issues"

[project.scripts]
chainstar = "chainstar.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/chainstar"]

[tool.hatch.build.targets.sdist]
include = ["src/chainstar", "tests", "README.md", "CHANGELOG.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: needs a Postgres server (set CHAINSTAR_TEST_POSTGRES_DSN)"]
