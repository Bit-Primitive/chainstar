seeds:
  - name: chains
    description: Chains chainstar supports. Kept in step with chainstar/chains.py by a unit test.
    config:
      column_types:
        # ClickHouse columns are not nullable unless declared so.
        chain_id: "{{ 'Nullable(Int64)' if target.type == 'clickhouse' else 'bigint' }}"
        chain: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
        native_symbol: "{{ 'string' if target.type == 'bigquery' else 'varchar(16)' }}"
        native_decimals: integer
    columns:
      - name: chain_id
        description: EVM chain id. NULL for Bitcoin and Solana, which have none.
        data_tests: [unique]
      - name: chain
        data_tests: [unique, not_null]

  - name: dex_venues
    description: >
      DEX factories whose pools chainstar names as venues, with the event layout
      their pools emit. Kept in step with chainstar/venues.py by a unit test.
    config:
      column_types:
        chain: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
        factory_address: "{{ 'string' if target.type == 'bigquery' else 'varchar(64)' }}"
        venue: "{{ 'string' if target.type == 'bigquery' else 'varchar(64)' }}"
        event_family: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
    columns:
      - name: factory_address
        data_tests: [not_null]

  - name: price_assets
    description: >
      The assets USD prices are anchored to, by contract address or mint: USD
      stablecoins (taken at 1 USD), each chain's wrapped native token (priced as the
      native asset) and wrapped BTC (which prices Bitcoin). Kept in step with
      chainstar/venues.py by a unit test.
    config:
      column_types:
        chain: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
        token_address: "{{ 'string' if target.type == 'bigquery' else 'varchar(64)' }}"
        role: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
        symbol: "{{ 'string' if target.type == 'bigquery' else 'varchar(16)' }}"
        decimals: integer
    columns:
      - name: role
        data_tests:
          - accepted_values:
              arguments:
                values: ["usd_stablecoin", "wrapped_native", "wrapped_btc"]
