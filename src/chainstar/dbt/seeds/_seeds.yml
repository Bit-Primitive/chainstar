seeds:
  - name: chains
    description: Chains chainstar supports. Kept in step with chainstar/chains.py by a unit test.
    config:
      column_types:
        # ClickHouse columns are not nullable unless declared so.
        chain_id: "{{ 'Nullable(Int64)' if target.type == 'clickhouse' else 'bigint' }}"
        chain: "{{ 'string' if target.type == 'bigquery' else 'varchar(32)' }}"
        native_symbol: "{{ 'string' if target.type == 'bigquery' else 'varchar(16)' }}"
        native_decimals: integer
    columns:
      - name: chain_id
        description: EVM chain id. NULL for Bitcoin and Solana, which have none.
        data_tests: [unique]
      - name: chain
        data_tests: [unique, not_null]
