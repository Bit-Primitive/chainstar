name: chainstar
version: "0.1.0"
config-version: 2
profile: chainstar
require-dbt-version: [">=1.10.0", "<2.0.0"]

model-paths: ["models"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

vars:
  # The chains the models know, with their EVM chain ids. Kept in step with
  # chainstar/chains.py by a unit test.
  chainstar_chains:
    ethereum: 1
    base: 8453
    bitcoin: null
    solana: null
  # USD prices from swaps (models/marts/fct_token_prices.sql, macros/prices.sql).
  # Swaps worth less than this many USD are not used: their prices are mostly rounding.
  price_min_swap_usd: 10
  # Observations further than this fraction from the bucket's median are rejected.
  price_outlier_band: 0.1
  # Confidence: high needs all three; medium the first two of its own.
  price_high_min_observations: 5
  price_high_min_volume_usd: 10000
  price_high_min_sources: 2
  price_medium_min_observations: 3
  price_medium_min_volume_usd: 1000

flags:
  # chainstar sends no telemetry, and neither should dbt on its behalf.
  send_anonymous_usage_stats: false

models:
  chainstar:
    staging:
      +schema: staging
      +materialized: view
    # Chain-specific staging rows reshaped to the columns all chains share.
    intermediate:
      +schema: staging
      +materialized: view
    # Incremental: `chainstar sync` builds only rows above each table's per-chain
    # watermark (see macros/incremental.sql); `chainstar run` rebuilds in full.
    # delete+insert on each table's unique key: dbt-duckdb, dbt-postgres,
    # dbt-snowflake and dbt-clickhouse (as delete_insert, with lightweight
    # deletes) support it on every version chainstar allows; merge needs DuckDB
    # 1.4 or Postgres 15. dbt-bigquery has no delete+insert, and its merge on the
    # same key replaces the same rows.
    marts:
      +materialized: incremental
      +incremental_strategy: "{{ 'merge' if target.type == 'bigquery' else 'delete+insert' }}"
      +on_schema_change: fail

seeds:
  chainstar:
    +schema: staging
