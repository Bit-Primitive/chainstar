models:
  - name: fct_transfers
    description: >
      One row per value movement in the loaded ranges. EVM: an ERC-20 Transfer event.
      Bitcoin: a transaction output (coinbase outputs included). Solana: a parsed SPL
      token transfer or System Program SOL transfer instruction, top-level or inner,
      of a successful transaction.
    columns:
      - name: transfer_id
        description: "chain:transaction_hash:transfer_position"
        data_tests: [unique, not_null]
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ethereum", "base", "bitcoin", "solana"]
      - name: block_number
        description: Block number; Bitcoin block height; Solana slot.
        data_tests: [not_null]
      - name: block_timestamp
        description: Block time, UTC. Bitcoin uses the header time; Solana the block's estimated production time.
        data_tests: [not_null]
      - name: date_day
        description: Block date, UTC. Joins to dim_dates.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: transaction_hash
        description: Transaction hash; Bitcoin txid; Solana first signature.
        data_tests: [not_null]
      - name: transaction_index
        description: Position of the transaction in its block.
      - name: transfer_position
        description: >
          Position of the transfer within its transaction: the log index (EVM), the
          output index (Bitcoin), or the instruction position (Solana), "3" for the
          fourth top-level instruction and "3.1" for its second inner instruction.
        data_tests: [not_null]
      - name: log_index
        description: EVM only; NULL for Bitcoin and Solana.
        data_tests:
          - not_null:
              config:
                where: "chain in ('ethereum', 'base')"
      - name: token_id
        description: Joins to dim_tokens. On EVM chains also to dim_contracts.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tokens')
                field: token_id
      - name: from_wallet_id
        description: >
          Sender. Joins to dim_wallets. EVM: the zero address means a mint. Bitcoin:
          set only when every input of the transaction came from one address, NULL
          otherwise and for the coinbase.
        data_tests:
          - not_null:
              config:
                where: "chain <> 'bitcoin'"
          - relationships:
              arguments:
                to: ref('dim_wallets')
                field: wallet_id
      - name: to_wallet_id
        description: >
          Recipient. Joins to dim_wallets. EVM: the zero address means a burn.
          Bitcoin: NULL for outputs without an address (see script_type).
        data_tests:
          - not_null:
              config:
                where: "chain <> 'bitcoin'"
          - relationships:
              arguments:
                to: ref('dim_wallets')
                field: wallet_id
      - name: token_address
        description: ERC-20 contract, SPL mint, or 'native' for BTC and SOL.
      - name: from_address
        description: For SPL tokens, the wallet that owns the sending token account.
      - name: to_address
        description: For SPL tokens, the wallet that owns the receiving token account.
      - name: input_address_count
        description: Bitcoin only. Distinct addresses among the transaction's inputs; 0 for the coinbase.
      - name: from_token_account
        description: Solana SPL only. The token account debited.
      - name: to_token_account
        description: Solana SPL only. The token account credited.
      - name: script_type
        description: Bitcoin only. The output's script type as the node names it, e.g. witness_v0_keyhash, nulldata (OP_RETURN).
      - name: amount_raw
        description: Exact transferred amount in the asset's smallest unit (wei-scale token units, satoshis, lamports), as a base-10 integer string.
        data_tests: [not_null]
      - name: amount
        description: >
          amount_raw divided by 10^decimals, as double precision (about 15 significant
          digits). NULL when the token's decimals are unknown.
      - name: amount_usd
        description: >
          amount at usd_price, the token's on-chain USD price for the block's UTC hour
          (fct_token_prices; WETH and wrapped SOL as ETH and SOL). NULL when the token
          has no price that hour with confidence peg, high or medium.
      - name: usd_price
        description: The hourly USD price used, from fct_token_prices.
      - name: price_method
        description: How that price was derived (see fct_token_prices.price_method).
      - name: price_confidence
        description: peg, high or medium; NULL when unpriced.
        data_tests:
          - accepted_values:
              arguments:
                values: ["peg", "high", "medium"]
      - name: price_bucket_start
        description: Start (UTC) of the hour whose price was used.

  - name: fct_fees
    description: >
      One row per fee-paying transaction. EVM: execution fee (gas_used x effective gas
      price), excluding Ethereum blob fees and Base's L1 data fee. Bitcoin: inputs minus
      outputs; the coinbase is left out. Solana: meta.fee, including failed and vote
      transactions.
    columns:
      - name: fee_id
        description: "chain:transaction_hash"
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]
      - name: block_number
        data_tests: [not_null]
      - name: block_timestamp
        data_tests: [not_null]
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: transaction_hash
        data_tests: [not_null]
      - name: transaction_index
      - name: payer_wallet_id
        description: >
          Who paid the fee. Joins to dim_wallets. EVM: the sender. Solana: the fee payer
          (first account). Bitcoin: set only when one address funded the whole
          transaction.
        data_tests:
          - not_null:
              config:
                where: "chain <> 'bitcoin'"
          - relationships:
              arguments:
                to: ref('dim_wallets')
                field: wallet_id
      - name: from_address
      - name: to_address
        description: EVM only; NULL for contract creation, and for Bitcoin and Solana.
      - name: transaction_type
        description: "EVM only. EIP-2718 type: 0 legacy, 1 access list, 2 EIP-1559, 3 blob, 4 set-code; 126 is an OP-stack deposit on Base."
      - name: success
        description: Always true for Bitcoin, whose blocks hold only valid transactions.
      - name: is_vote
        description: Solana only. True for validator vote transactions.
      - name: gas_limit
        description: EVM only.
      - name: gas_used
        description: EVM only.
        data_tests:
          - not_null:
              config:
                where: "chain in ('ethereum', 'base')"
      - name: effective_gas_price_wei
        description: EVM only.
        data_tests:
          - not_null:
              config:
                where: "chain in ('ethereum', 'base')"
      - name: base_fee_per_gas_wei
        description: EVM only.
      - name: execution_fee_wei
        description: EVM only. gas_used x effective_gas_price_wei, exact; equals fee_raw.
      - name: fee_raw
        description: The fee in the chain's smallest unit (wei, satoshis, lamports), exact.
        data_tests: [not_null]
      - name: native_symbol
      - name: fee_native
        description: fee_raw in whole native units (ETH, BTC, SOL), as double precision.
      - name: execution_fee_native
        description: EVM only. execution_fee_wei in ETH, as double precision.
      - name: fee_usd
        description: >
          fee_native at the native asset's on-chain USD price for the block's UTC hour
          (fct_token_prices); NULL when unpriced.
      - name: native_usd_price
        description: The hourly USD price of ETH, BTC or SOL used.
      - name: price_method
      - name: price_confidence
        data_tests:
          - accepted_values:
              arguments:
                values: ["peg", "high", "medium"]
      - name: price_bucket_start
        description: Start (UTC) of the hour whose price was used.

  - name: fct_swaps
    description: >
      One row per DEX swap. Ethereum and Base: a decoded Uniswap v2-style, Uniswap
      v3-style or Aerodrome Swap event. Solana: what one signer gave and got in a
      successful transaction that called a known DEX program, from its balance
      changes.
    columns:
      - name: swap_id
        description: "chain:transaction_hash:swap_position"
        data_tests: [unique, not_null]
      - name: chain
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ethereum", "base", "solana"]
      - name: block_number
        data_tests: [not_null]
      - name: block_timestamp
        data_tests: [not_null]
      - name: date_day
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_dates')
                field: date_day
      - name: transaction_hash
        data_tests: [not_null]
      - name: swap_position
        description: The log index (EVM); "0" on Solana, one swap per transaction.
        data_tests: [not_null]
      - name: venue
        description: >
          EVM: the venue of the pool's factory (uniswap_v2, uniswap_v3, sushiswap_v2,
          sushiswap_v3, aerodrome_v2, aerodrome_slipstream), or 'unknown'. Solana: the
          known DEX programs the transaction called, joined with '+'.
        data_tests: [not_null]
      - name: swap_method
        description: uniswap_v2, uniswap_v3 or solidly_v2 (the event layout), or balance_changes (Solana).
      - name: pool_id
        description: EVM only. Joins to dim_pools.
        data_tests:
          - not_null:
              config:
                where: "chain in ('ethereum', 'base')"
          - relationships:
              arguments:
                to: ref('dim_pools')
                field: pool_id
      - name: pool_verified
        description: EVM only. The pool's factory is a known venue and confirms the pool.
      - name: trader
        description: EVM, the transaction's sender (NULL in a wallet history); Solana, the signer.
      - name: sender
        description: EVM only. The event's sender, usually a router.
      - name: recipient
        description: EVM only. The event's recipient of the output.
      - name: token_in_id
        data_tests: [not_null]
      - name: token_out_id
        data_tests: [not_null]
      - name: token_in_address
        description: What the trader paid; 'native' for SOL (and wrapped SOL) on Solana.
      - name: token_out_address
        description: What the trader received.
      - name: amount_in_raw
        description: Exact amount paid, in the token's smallest unit.
        data_tests: [not_null]
      - name: amount_out_raw
        data_tests: [not_null]
      - name: amount_in
        description: amount_in_raw / 10^decimals; NULL when decimals are unknown.
      - name: amount_out
      - name: usd_value
        description: >
          The swap's USD value, from the hourly price of one side (a stablecoin side
          first, then the native asset, then token_in); NULL when unpriced or on EVM
          when the pool is not verified.
      - name: usd_value_side
        description: in or out, the side usd_value comes from.
      - name: price_method
      - name: price_confidence
        data_tests:
          - accepted_values:
              arguments:
                values: ["peg", "high", "medium"]
      - name: price_bucket_start

  - name: fct_token_prices
    description: >
      USD prices per asset, UTC hour and UTC day, derived from on-chain swaps only:
      USD stablecoins at 1 USD, other assets from their swaps against those and
      against the native asset, outliers rejected, with the number of observations,
      volume and a confidence. Bitcoin from wrapped BTC on Ethereum and Base.
    columns:
      - name: price_id
        description: "chain:token_address:granularity:bucket_start_unix"
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]
      - name: token_address
        description: The asset; 'native' for ETH, BTC and SOL (WETH and wrapped SOL are priced as these).
        data_tests: [not_null]
      - name: token_id
        description: "chain:token_address"
      - name: granularity
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["hour", "day"]
      - name: bucket_start
        description: Start of the UTC hour or day.
        data_tests: [not_null]
      - name: date_day
      - name: bucket_start_unix
      - name: usd_price
        description: >
          The price chainstar values things at: 1 for stablecoins, the observed price
          when confidence is high or medium, NULL otherwise.
      - name: observed_price
        description: Lower median of the observations kept; for stablecoins, from swaps against other stablecoins.
      - name: price_low
        description: Lowest observation kept.
      - name: price_high
        description: Highest observation kept.
      - name: price_method
        description: >
          usd_stablecoin_peg, swaps_vs_stablecoins, swaps_vs_native,
          swaps_vs_stablecoins_and_native, or cross_chain_wrapped_btc (Bitcoin).
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - usd_stablecoin_peg
                  - swaps_vs_stablecoins
                  - swaps_vs_native
                  - swaps_vs_stablecoins_and_native
                  - cross_chain_wrapped_btc
      - name: confidence
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["peg", "high", "medium", "low", "none"]
      - name: observations
        description: Swaps kept (at least price_min_swap_usd, within price_outlier_band of the median).
      - name: rejected_observations
      - name: volume_usd
        description: USD volume of the swaps kept, in cents.
      - name: sources
        description: Distinct pools (EVM) or traders (Solana) among the swaps kept.
      - name: last_block_number
        description: The chain's newest block in the bucket.

  - name: dim_pools
    description: >
      Every pool that emitted a swap event on Ethereum or Base, with its tokens,
      factory and fee as read from the contracts at the chain head.
    columns:
      - name: pool_id
        description: "chain:pool_address"
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]
      - name: pool_address
        data_tests: [not_null]
      - name: venue
        description: The factory's venue (see fct_swaps.venue), or 'unknown'.
      - name: event_family
      - name: factory_address
        description: What the pool's factory() returned.
      - name: factory_confirms
        description: The factory returns this pool for the same tokens (and fee, tick spacing or stable flag).
      - name: is_verified
        description: factory_confirms, and the factory is a known venue. Only verified pools price tokens.
      - name: token0_address
      - name: token1_address
      - name: token0_id
      - name: token1_id
      - name: fee
        description: Uniswap v3-style pools, fee() as read, in hundredths of a basis point (500 = 0.05%).
      - name: tick_spacing
      - name: is_stable
        description: Aerodrome pools only, stable() as read.
      - name: metadata_block_number
      - name: first_seen_block
      - name: last_seen_block
      - name: swap_events

  - name: dim_wallets
    description: >
      Every address that sent or received a transfer, or paid for a transaction, in
      the loaded data. Some are contracts or programs; this release does not tell
      them apart.
    columns:
      - name: wallet_id
        description: "chain:address"
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]
      - name: address
        description: EVM lowercase 0x hex; Bitcoin address as the node gives it; Solana base58 public key.
        data_tests: [not_null]
      - name: is_zero_address
      - name: first_seen_block
      - name: first_seen_at
      - name: last_seen_block
      - name: last_seen_at
      - name: transfers_out
        description: Transfers sent. Bitcoin counts inputs spent from the address.
      - name: transfers_in
      - name: transactions_sent
        description: Transactions paid for. Bitcoin counts transactions the address helped fund.

  - name: dim_tokens
    description: >
      Every asset moved in the loaded data: ERC-20 contracts with the name, symbol and
      decimals cryo read at the chain head; SPL mints with decimals from the
      transactions; and BTC and SOL under the token address 'native'.
    columns:
      - name: token_id
        description: "chain:token_address"
        data_tests:
          - unique
          - not_null
          - relationships:
              arguments:
                to: ref('dim_contracts')
                field: contract_id
              config:
                where: "token_standard = 'erc20'"
      - name: chain
        data_tests: [not_null]
      - name: token_address
        data_tests: [not_null]
      - name: token_standard
        description: erc20, spl-token, spl-token-2022 or native.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["erc20", "spl-token", "spl-token-2022", "native"]
      - name: name
        description: >
          ERC-20 only, as returned by cryo 0.3.2, which strips spaces (e.g. "WrappedEther").
          NULL for SPL mints and native assets.
      - name: symbol
        description: ERC-20 symbol, or BTC / SOL for native assets. NULL for SPL mints.
      - name: decimals
      - name: metadata_block_number
        description: ERC-20 only. Block at which name, symbol and decimals were read.
      - name: has_metadata
        description: False when none of name, symbol and decimals is known.
      - name: first_seen_block
        description: First block (Solana slot) in the loaded data where the asset moved.
        data_tests: [not_null]
      - name: last_seen_block
        description: Last block (Solana slot) in the loaded data where the asset moved.
        data_tests: [not_null]

  - name: dim_contracts
    description: >
      Contracts chainstar can identify. In this release: only EVM token contracts that
      emitted ERC-20 Transfer events in the loaded data.
    columns:
      - name: contract_id
        description: "chain:contract_address"
        data_tests: [unique, not_null]
      - name: chain
        data_tests: [not_null]
      - name: contract_address
        data_tests: [not_null]
      - name: contract_type
        description: Always 'erc20' in this release.
      - name: first_seen_block
      - name: last_seen_block
      - name: transfer_events

  - name: dim_dates
    description: One row per UTC calendar day from the earliest to the latest loaded block.
    columns:
      - name: date_day
        data_tests: [unique, not_null]
      - name: year
      - name: quarter
      - name: month
      - name: day_of_month
      - name: iso_day_of_week
        description: 1 = Monday ... 7 = Sunday.
      - name: iso_week
      - name: is_weekend
